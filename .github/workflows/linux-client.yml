name: Build Linux Game Client

on:
  workflow_dispatch:
  push:
    paths:
      - 'crates/**'
      - 'scripts/build-linux-client.sh'
      - 'scripts/linux/openomsi.desktop'
      - '.github/workflows/linux-client.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'assets/**'
      - 'VERSION'
      - 'docs/LINUX-CLIENT.md'

permissions:
  contents: read

jobs:
  linux-client:
    name: Build current Sobol3D graphical client for Linux x64
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout current game source
        uses: actions/checkout@v4
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libudev-dev \
            libgtk-3-dev libxkbcommon-dev libwayland-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check game and launcher
        run: |
          cargo check --locked -p omsi-app --bin openomsi
          cargo check --locked -p omsi-launcher-core --bin openomsi-launcher
      - name: Build Linux game and tar.gz
        run: sh scripts/build-linux-client.sh
      - name: Verify six archive entries and game CLI
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          archive="dist/Sobols-openOMSI-$version-linux-x64.tar.gz"
          test -s "$archive"
          root="$RUNNER_TEMP/client-check"
          mkdir -p "$root"
          tar -xzf "$archive" -C "$root"
          test -x "$root/openomsi"
          test -x "$root/openomsi-launcher"
          test -s "$root/libsteam_api.so"
          test -s "$root/openomsi.png"
          test -s "$root/openomsi.desktop"
          test -d "$root/Assets/Infobox"
          test -d "$root/Assets/TM-Summertime"
          test ! -e "$root/openomsi-server"
          test ! -e "$root/start.sh"
          test ! -e "$root/start-client.sh"
          actual="$(find "$root" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          expected="$(printf '%s\n' Assets libsteam_api.so openomsi openomsi.desktop openomsi.png openomsi-launcher | sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'Unexpected archive contents:\nActual:\n%s\nExpected:\n%s\n' "$actual" "$expected" >&2
            exit 1
          fi
          if tar -tzf "$archive" | grep -E '(^/|(^|/)\.\.(/|$))'; then
            echo "Unsafe archive path." >&2
            exit 1
          fi
          (cd "$root" && ./openomsi --help > "$RUNNER_TEMP/openomsi-help.txt")
          grep -q -- '--root' "$RUNNER_TEMP/openomsi-help.txt"
          echo 'Extracted Linux game binary loads and prints --help.'
          sha256sum "$archive"
      - name: Upload tar.gz separately from Dedicated Server releases
        uses: actions/upload-artifact@v4
        with:
          name: Sobols-openOMSI-linux-x64-tar-gz
          path: dist/Sobols-openOMSI-*-linux-x64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
