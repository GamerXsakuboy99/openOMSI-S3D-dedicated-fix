name: Build Linux Game Client

on:
  workflow_dispatch:
  push:
    paths:
      - 'crates/**'
      - 'scripts/build-linux-client.sh'
      - 'scripts/linux/**'
      - '.github/workflows/linux-client.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'assets/**'
      - 'docs/LINUX-CLIENT.md'

permissions:
  contents: read

jobs:
  linux-client:
    name: Build playable Linux x64 client (separate from server)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout Sobol3D Edition fork
        uses: actions/checkout@v4
      - name: Install native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libudev-dev \
            libgtk-3-dev libxkbcommon-dev libwayland-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check actual graphical game and launcher
        run: |
          cargo check --locked -p omsi-app --bin openomsi
          cargo check --locked -p omsi-launcher-core --bin openomsi-launcher

      - name: Build the playable Linux game
        run: sh scripts/build-linux-client.sh

      - name: Verify game release content and CLI
        shell: bash
        run: |
          set -euo pipefail
          root=dist/linux-client
          test -x "$root/openomsi"
          test -x "$root/openomsi-launcher"
          test -x "$root/start-client.sh"
          test -s "$root/libsteam_api.so"
          test -s "$root/openomsi.png"
          test -s "$root/openomsi.desktop"
          test -s "$root/README.md"
          test -d "$root/Assets/Infobox"
          test -d "$root/Assets/TM-Summertime"
          test ! -e "$root/openomsi-server"
          test ! -e "$root/start.sh"
          cd "$root"
          # Does not need a display or OMSI 2 assets for a --help smoke test.
          ./openomsi --help > "$RUNNER_TEMP/openomsi-help.txt"
          grep -q -- '--root' "$RUNNER_TEMP/openomsi-help.txt"
          # If a shared library is missing, the OS loader would fail above.
          echo 'The packaged Linux game binary starts and responds to --help.'

      - name: Upload playable Linux client (not the server release)
        uses: actions/upload-artifact@v4
        with:
          name: openOMSI-Sobol3D-0.4.2-linux-client-x64
          path: dist/linux-client/
          if-no-files-found: error
          retention-days: 30
