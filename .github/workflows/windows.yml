name: Build Dedicated Server Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'crates/**'
      - 'scripts/server/**'
      - 'scripts/build-windows.cmd'
      - '.github/workflows/windows.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

jobs:
  windows-server:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Set short Cargo target path
        shell: pwsh
        run: |
          $targetDir = Join-Path $env:RUNNER_TEMP 't'
          New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
          "CARGO_TARGET_DIR=$targetDir" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Check dedicated server binary
        shell: pwsh
        run: |
          cargo check --locked -p omsi-app --bin openomsi-server
          if ($LASTEXITCODE -ne 0) { throw 'Cargo check failed' }
      - name: Build Windows Dedicated Server
        shell: pwsh
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc -p omsi-app --bin openomsi-server
          if ($LASTEXITCODE -ne 0) { throw 'Cargo release build failed' }
      - name: Assemble server-only distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'dist/windows-server'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/release/openomsi-server.exe" "$out/openomsi-server.exe"
          Copy-Item 'scripts/server/start.cmd' "$out/start.cmd"
          Copy-Item 'docs/SERVER.md' "$out/README.md"
          Copy-Item 'LICENSE' "$out/LICENSE"
          Copy-Item 'assets/steam_redist/steam_api64.dll' "$out/steam_api64.dll"
          # Some Windows systems need DX shader compiler/MSVC runtime DLLs.
          $version = (Get-Content -LiteralPath 'VERSION' -Raw).Trim()
          $url = "https://github.com/sobolx30/openOMSI-Sobol3D-Edition/releases/download/v$version/openOMSI-$version-windows-x64.zip"
          $archive = Join-Path $env:RUNNER_TEMP 'upstream.zip'
          $unpacked = Join-Path $env:RUNNER_TEMP 'upstream'
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $unpacked -Force
          foreach ($dll in @('dxcompiler.dll','dxil.dll','msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll')) {
            $file = Join-Path $unpacked $dll
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing runtime $dll in upstream archive" }
            Copy-Item $file "$out/$dll"
          }
          New-Item -ItemType Directory -Force -Path "$out/Assets" | Out-Null
          foreach ($folder in @('Infobox','TM-Summertime')) {
            Copy-Item "assets/$folder" "$out/Assets/$folder" -Recurse -Force
          }
          if (Test-Path "$out/openomsi.exe" -or Test-Path "$out/openomsi-launcher.exe") {
            throw 'Client binary was included accidentally'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: openOMSI-DedicatedServer-0.4.2-windows-x64
          path: dist/windows-server/
          retention-days: 14
          if-no-files-found: error
