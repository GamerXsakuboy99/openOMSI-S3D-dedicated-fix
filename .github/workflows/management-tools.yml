name: Test Dedicated Server Management Tools

on:
  workflow_dispatch:
  push:
    paths:
      - 'addons/**'
      - 'scripts/server/**'
      - '.github/workflows/management-tools.yml'

permissions:
  contents: read

jobs:
  linux-discord:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Python Discord Bridge syntax and offline tests
        run: |
          python3 -m py_compile addons/DiscordBridge/DiscordBridge.py
          python3 addons/DiscordBridge/DiscordBridge.py --self-test
          python3 -m json.tool addons/DiscordBridge/config.example.json > /dev/null

  tools:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Validate addon files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @(
            'addons/AdminPlus/AdminPlus.ps1',
            'addons/AdminPlus/Start-AdminPlus.cmd',
            'addons/AdminPlus/README.md',
            'addons/DiscordBridge/DiscordBridge.ps1',
            'addons/DiscordBridge/Start-DiscordBridge.cmd',
            'addons/DiscordBridge/Test-Webhook.cmd',
            'addons/DiscordBridge/config.example.json',
            'addons/DiscordBridge/README.md'
          )) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing component $file"
            }
          }
          foreach ($script in @('addons/AdminPlus/AdminPlus.ps1','addons/DiscordBridge/DiscordBridge.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path,[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax error: $script"
            }
          }
          Get-Content 'addons/DiscordBridge/config.example.json' -Raw | ConvertFrom-Json | Out-Null
          Write-Host 'Addon files, scripts and JSON valid.'
      - name: Verify Windows server startup wizard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/server/Start-Server.ps1').Path,[ref]$tokens,[ref]$errors)
          if ($errors.Count -gt 0) { throw 'Start-Server.ps1 contains PowerShell errors' }
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -ExecutionPolicy Bypass -STA -File scripts/server/Start-Server.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Server startup wizard offline tests failed.' }
      - name: Verify Admin Plus WPF and custom weather
        shell: pwsh
        run: |
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -ExecutionPolicy Bypass -STA -File 'addons/AdminPlus/AdminPlus.ps1' -ValidateXaml
          if ($LASTEXITCODE -ne 0) { throw 'Admin Plus smoke test failed.' }
      - name: Verify Discord Bridge journaling
        shell: pwsh
        run: |
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -ExecutionPolicy Bypass -File 'addons/DiscordBridge/DiscordBridge.ps1' -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Discord Bridge smoke test failed.' }
