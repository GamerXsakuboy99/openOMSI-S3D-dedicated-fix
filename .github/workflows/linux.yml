name: Build Dedicated Server Linux

on:
  workflow_dispatch:
  push:
    paths:
      - 'crates/**'
      - 'scripts/server/**'
      - 'scripts/build-linux.sh'
      - '.github/workflows/linux.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'README.md'
      - 'docs/SERVER.md'
      - '.github/workflows/release.yml'
      - 'addons/DiscordBridge/**'

permissions:
  contents: read

jobs:
  linux-server:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libudev-dev libgtk-3-dev libxkbcommon-dev libwayland-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check server-only Rust binary
        run: cargo check --locked -p omsi-app --bin openomsi-server
      - name: Build Linux dedicated server
        run: sh scripts/build-linux.sh
      - name: Test optional Linux Discord Bridge
        run: |
          python3 -m py_compile addons/DiscordBridge/DiscordBridge.py
          python3 addons/DiscordBridge/DiscordBridge.py --self-test
          mkdir -p dist/linux-server/DiscordBridge
          cp addons/DiscordBridge/DiscordBridge.py dist/linux-server/DiscordBridge/
          cp addons/DiscordBridge/Start-DiscordBridge.sh dist/linux-server/DiscordBridge/
          cp addons/DiscordBridge/config.example.json dist/linux-server/DiscordBridge/
          cp addons/DiscordBridge/README.md dist/linux-server/DiscordBridge/
          chmod +x dist/linux-server/DiscordBridge/Start-DiscordBridge.sh
      - name: Confirm release contains no playable client
        run: |
          test -f dist/linux-server/openomsi-server
          test -f dist/linux-server/start.sh
          test -f dist/linux-server/README.md
          test ! -f dist/linux-server/openomsi
          test ! -f dist/linux-server/openomsi-launcher
      - uses: actions/upload-artifact@v4
        with:
          name: openOMSI-DedicatedServer-0.4.2-linux-x64
          path: dist/linux-server/
          retention-days: 14
          if-no-files-found: error
