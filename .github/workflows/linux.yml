name: Build openOMSI Linux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux x86_64 Release
    runs-on: ubuntu-22.04

    steps:
      # Use this repository's selected branch, including local fixes
      - name: Checkout local openOMSI source
        uses: actions/checkout@v4

      # Install Linux build dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libgtk-3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libssl-dev

      # Install latest stable Rust
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Cache Rust dependencies
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      # Build Linux release using original script
      - name: Build openOMSI Linux
        run: |
          sh scripts/build-linux.sh

      # Include the extra content from the Windows release in the same directory layout.
      # Keep a capital A: paths are case-sensitive on Linux.
      - name: Copy release Assets
        run: |
          test -d assets/Infobox
          test -d assets/TM-Summertime
          mkdir -p dist/linux/Assets
          cp -a assets/Infobox assets/TM-Summertime dist/linux/Assets/

      # Verify required files exist
      - name: Verify Linux build
        run: |
          test -f dist/linux/openomsi
          test -f dist/linux/openomsi-launcher
          test -f dist/linux/libsteam_api.so
          test -f dist/linux/openomsi.desktop
          test -f dist/linux/openomsi.png
          test -f dist/linux/Assets/Infobox/FIB.o3d
          test -f dist/linux/Assets/Infobox/FIB.png
          test -f dist/linux/Assets/Infobox/model.asset
          test -f dist/linux/Assets/TM-Summertime/model.o3d
          test -f dist/linux/Assets/TM-Summertime/TMSummertime.png
          test -f dist/linux/Assets/TM-Summertime/model.asset

          echo "Linux build files:"
          ls -lh dist/linux/
          find dist/linux/Assets -type f -print | sort

      # Create clean Linux archive
      # No extra ./ directory entries
      - name: Package Linux release
        run: |
          tar -czf Sobols-openOMSI-0.4.2-linux-x64.tar.gz \
            -C dist/linux \
            openomsi \
            openomsi-launcher \
            libsteam_api.so \
            openomsi.desktop \
            openomsi.png \
            Assets

      # Verify archive contents
      - name: Verify archive
        run: |
          echo "Archive contents:"
          entries="$(tar -tzf Sobols-openOMSI-0.4.2-linux-x64.tar.gz)"
          printf '%s\n' "$entries"
          printf '%s\n' "$entries" | grep -Fxq 'Assets/Infobox/model.asset'
          printf '%s\n' "$entries" | grep -Fxq 'Assets/TM-Summertime/model.asset'

      # Upload downloadable build
      - name: Upload Linux release
        uses: actions/upload-artifact@v4
        with:
          name: Sobols-openOMSI-0.4.2-linux-x64
          path: Sobols-openOMSI-0.4.2-linux-x64.tar.gz
          retention-days: 7
          if-no-files-found: error
